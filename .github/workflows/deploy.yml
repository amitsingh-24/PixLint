name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC — required for PyPI Trusted Publishing (no token/secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pyproject.toml
        id: ver
        run: echo "version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and push image (skips if Docker Hub secrets unset)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub secrets not set — skipping Docker publish."
            exit 0
          fi
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          docker build -t "$DH_USER/pixlint:latest" -t "$DH_USER/pixlint:$VERSION" .
          docker push "$DH_USER/pixlint:latest"
          docker push "$DH_USER/pixlint:$VERSION"
